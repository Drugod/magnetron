[package]
name = "magnet"
version = "0.8.0"
description = "Buscador local de torrents autorizados"
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
md-5 = "0.10"
md4 = "0.10"
hex = "0.4"
url = "2"
scraper = "0.24"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
open = "5"
mainline = "8.0.1"
serde_bencode = "0.2"
rand = "0.8"
roxmltree = "0.20"
sha2 = "0.10"
ring = "0.17.14"
flate2 = "1"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
rfd = "0.15"
tempfile = "3"
anyhow = "1"
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
