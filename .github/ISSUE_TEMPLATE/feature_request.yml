name: Feature request
description: Suggest an improvement while keeping MAGNETRON simple.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
      description: Explain how this should work for the user.
    validations:
      required: true
