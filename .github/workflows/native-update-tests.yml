name: Native updater recovery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/test-native-update.mjs scripts/test-sign-update.mjs
