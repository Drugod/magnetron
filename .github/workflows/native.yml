name: Linux and macOS (experimental)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            artifact: MAGNETRON-Linux-x64-experimental
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: MAGNETRON-macOS-arm64-experimental
          - name: macOS Intel
            runner: macos-15-intel
            artifact: MAGNETRON-macOS-x64-experimental
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: "true"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - run: npm ci
      - name: Prepare pinned native engines and licenses
        run: python scripts/prepare-native.py
      - run: python scripts/test-native-preparation.py
      - run: python scripts/test-engine-guard.py
      - run: python scripts/check-vendor-patches.py
      - run: npm test
      - run: npm run build
      # Hosted Intel runners can have an unresolvable local hostname. aMuled
      # resolves it synchronously before opening its control socket. This entry
      # describes only the disposable runner, never an end user's machine.
      - name: Resolve the macOS runner hostname locally
        if: runner.os == 'macOS'
        run: |
          sudo hostname localhost
          python -c "import socket; assert socket.gethostname() == 'localhost'; assert socket.getaddrinfo(socket.gethostname(), None)"
      - name: Test Rust on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test Rust on macOS
        if: runner.os == 'macOS'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test bundled v2 transfer worker
        run: vendor/native/v2/bin/python3 -I scripts/test-v2.py
      - name: Build native packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export LD_LIBRARY_PATH="$PWD/vendor/native/v2/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          npm run tauri -- build --verbose
      - name: Test optimized GLib security regression
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --release --manifest-path src-tauri/Cargo.toml patched_variant_string_iteration_survives_optimization
      - name: Test relocated package runtime
        run: python scripts/test-native-package.py
      - name: Package macOS application archive
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/MAGNETRON.app artifacts/MAGNETRON-macOS-app.zip
      - name: Generate checksums
        run: python scripts/package-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            artifacts/MAGNETRON-macOS-app.zip
            artifacts/SHA256SUMS-native.txt
