name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sign_updates:
        description: Sign this candidate installer (does not publish)
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: "true"
      - uses: actions/cache@v4
        with:
          path: vendor/video-build
          key: video-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/video-assets.json', 'scripts/prepare-video.py') }}
      - name: Windows video compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:/msys64/mingw64/bin/gcc.exe')) {
            & C:/msys64/usr/bin/bash.exe -lc 'pacman --noconfirm --needed -S mingw-w64-x86_64-gcc make'
            if ($LASTEXITCODE -ne 0) { throw 'Video compiler setup failed' }
          }
      - run: npm ci
      - run: node --test scripts/test-sign-update.mjs scripts/test-native-update.mjs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-engine.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-ed2k.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-v2.ps1
      - run: ./vendor/v2-runtime/python.exe -I scripts/test-native-preparation.py
      - run: ./vendor/v2-runtime/python.exe -I scripts/test-video.py
      - run: ./vendor/v2-runtime/python.exe -I scripts/test-v2.py
      - run: npm test
      - run: npm run build
      - run: npm run test:rust
      - run: npm run bundle
      - name: Validate installed distribution and upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-windows-upgrade.ps1 -Installer "src-tauri/target/release/bundle/nsis/MAGNETRON_${version}_x64-setup.exe" -Version $version
      - name: Sign and validate candidate installer
        if: github.event_name == 'workflow_dispatch' && inputs.sign_updates
        shell: pwsh
        env:
          MAGNETRON_UPDATE_PRIVATE_KEY: ${{ secrets.MAGNETRON_UPDATE_PRIVATE_KEY }}
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer="src-tauri/target/release/bundle/nsis/MAGNETRON_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force artifacts/signed-update | Out-Null
          Copy-Item -LiteralPath $installer -Destination artifacts/signed-update/
          node scripts/sign-update.mjs sign-env $installer $version "https://github.com/Drugod/magnetron/releases/download/v$version/MAGNETRON_${version}_x64-setup.exe" artifacts/signed-update/windows-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate signing failed' }
          $env:MAGNETRON_UPDATE_TEST_DIR=(Resolve-Path artifacts/signed-update).Path
          cargo test --locked --manifest-path src-tauri/Cargo.toml validates_real_signed_release_before_installation -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Signed candidate validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MAGNETRON-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            artifacts/signed-update/windows-update.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.sign_updates
        with:
          name: MAGNETRON-Windows-video-runtime
          path: |
            vendor/v2-runtime/video-tools/
            vendor/v2-runtime/video-packages/
            vendor/v2-runtime/video_worker.py
